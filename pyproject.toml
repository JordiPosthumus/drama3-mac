[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drama3-mac"
version = "0.1.0"
description = "Fish Audio Drama 3 TTS on Apple Silicon — MLX backbone/tower with a PyTorch codec decoder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Fish Audio Community License 1.0" }
dependencies = [
    "mlx>=0.29.0",
    "numpy",
    "safetensors",
    "tokenizers>=0.20",
    "einops",
    "soundfile",
    "soxr",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
drama3 = "drama3_mac.cli:main"

[tool.setuptools.packages.find]
include = ["drama3_mac*"]
